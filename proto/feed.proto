syntax = "proto3";

package cascade.feed.v1;

option go_package = "github.com/AnishK05/cascade-feed-ranking-engine/proto/gen/go/feed/v1;feedv1";
option java_package = "com.cascade.proto.feed.v1";
option java_multiple_files = true;

// FeedService serves ranked, paginated timelines to end users. It reads the
// fanout-on-write cache in Redis, merges in fanout-on-read candidates from
// celebrity accounts, hydrates content, ranks, and paginates the result.
// See IMPLEMENTATION_PLAN.md §5.4.
service FeedService {
  rpc GetFeed(GetFeedRequest) returns (GetFeedResponse);
}

message GetFeedRequest {
  int64 user_id = 1;
  // Opaque cursor for pagination, e.g. base64(last_rank_score). Empty for
  // the first page.
  string page_token = 2;
  // Defaults to 20, capped at 100 by the server.
  int32 page_size = 3;
}

message GetFeedResponse {
  repeated FeedItem items = 1;
  string next_page_token = 2;
}

message FeedItem {
  int64 post_id = 1;
  int64 author_id = 2;
  string content = 3;
  string media_url = 4;
  int64 created_at_unix_ms = 5;
  double rank_score = 6;
  // Weighted score components from the heuristic in IMPLEMENTATION_PLAN.md §8.1.
  // They sum to rank_score and power the frontend's "why am I seeing this" debug view.
  double recency_score = 7;
  double engagement_score = 8;
  double affinity_score = 9;
}
