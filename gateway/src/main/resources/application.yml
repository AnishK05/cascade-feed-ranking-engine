spring:
  application:
    name: gateway

server:
  port: ${GATEWAY_PORT:8080}

cascade:
  post-service-addr: ${POST_SERVICE_ADDR:localhost:9090}
  feed-service-addr: ${FEED_SERVICE_ADDR:localhost:9091}
  social-graph-base-url: ${SOCIAL_GRAPH_BASE_URL:http://localhost:8081}
  cors-allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
  grpc-deadline: ${GATEWAY_GRPC_DEADLINE:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
