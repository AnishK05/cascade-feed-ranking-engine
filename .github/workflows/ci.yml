name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate proto stubs
        run: make proto-go

      - name: go vet
        run: make go-vet

      - name: gofmt check
        run: make go-fmt-check

      - name: go build
        run: make go-build

      - name: go test
        run: make go-cover
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  java:
    name: Java services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Each module's checked-in Maven Wrapper pins the exact Maven version, and the
      # protobuf-maven-plugin (gateway only) downloads its own protoc binary via Maven Central,
      # so no extra system packages are needed here.
      - name: Test gateway
        working-directory: gateway
        run: ./mvnw -B -q test

      - name: Test social-graph-service
        working-directory: services/social-graph-service
        run: ./mvnw -B -q test

  python:
    name: Python (loadtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: loadtest
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: loadtest
        run: ruff check .

      - name: Test
        working-directory: loadtest
        run: pytest -q

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cascade
          POSTGRES_PASSWORD: cascade
          POSTGRES_DB: cascade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install migrate CLI
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Apply all up migrations
        run: make migrate-up

      - name: Roll back all migrations
        run: make migrate-down

      - name: Re-apply all up migrations
        run: make migrate-up

  infrastructure:
    name: Kafka Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Start PostgreSQL, Redis, and Kafka
        run: docker compose -f deploy/docker-compose.yml up -d --wait postgres redis kafka

      - name: Initialize Kafka topics
        run: make kafka-topics

      - name: Produce and consume a smoke message
        run: make kafka-smoke

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: Clean up
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize and kubeconform
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz" | tar -xz
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" | tar -xz
          sudo mv kustomize kubeconform /usr/local/bin
          kustomize version
          kubeconform -v

      - name: Validate kind manifests
        run: make k8s-validate
