apiVersion: v1
kind: Service
metadata:
  name: social-graph-service
  labels:
    app: social-graph-service
    app.kubernetes.io/part-of: cascade
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector:
    app: social-graph-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-graph-service
  labels:
    app: social-graph-service
    app.kubernetes.io/part-of: cascade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-graph-service
  template:
    metadata:
      labels:
        app: social-graph-service
        app.kubernetes.io/part-of: cascade
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "until pg_isready -h postgres -U cascade -d cascade; do sleep 2; done"]
        - name: wait-kafka
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              for i in $(seq 1 60); do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --topic follow-events --describe >/dev/null 2>&1 && exit 0
                sleep 2
              done
              exit 1
      containers:
        - name: social-graph-service
          image: cascade/social-graph-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: cascade-config
            - secretRef:
                name: cascade-db
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cascade-db
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cascade-db
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 8081
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /api/ping
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
