apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels:
    app: kafka-init
    app.kubernetes.io/part-of: cascade
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: kafka-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:29092
          command: ["/bin/bash", "/opt/cascade/kafka-init.sh"]
          volumeMounts:
            - name: script
              mountPath: /opt/cascade
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: kafka-init-script
            defaultMode: 0755
