apiVersion: v1
kind: Service
metadata:
  name: feed-service
  labels:
    app: feed-service
    app.kubernetes.io/part-of: cascade
spec:
  ports:
    - name: grpc
      port: 9091
      targetPort: 9091
    - name: metrics
      port: 9101
      targetPort: 9101
  selector:
    app: feed-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-service
  labels:
    app: feed-service
    app.kubernetes.io/part-of: cascade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feed-service
  template:
    metadata:
      labels:
        app: feed-service
        app.kubernetes.io/part-of: cascade
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "until pg_isready -h postgres -U cascade -d cascade; do sleep 2; done"]
        - name: wait-redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "until redis-cli -h redis ping | grep -q PONG; do sleep 2; done"]
      containers:
        - name: feed-service
          image: cascade/feed-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9091
            - containerPort: 9101
          envFrom:
            - configMapRef:
                name: cascade-config
            - secretRef:
                name: cascade-db
          env:
            - name: REDIS_ADDR
              value: redis:6379
            - name: POST_SERVICE_ADDR
              value: post-service:9090
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9101
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9101
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
