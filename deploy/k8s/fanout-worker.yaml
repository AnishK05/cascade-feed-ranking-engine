apiVersion: v1
kind: Service
metadata:
  name: fanout-worker
  labels:
    app: fanout-worker
    app.kubernetes.io/part-of: cascade
spec:
  ports:
    - name: metrics
      port: 9102
      targetPort: 9102
  selector:
    app: fanout-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fanout-worker
  labels:
    app: fanout-worker
    app.kubernetes.io/part-of: cascade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fanout-worker
  template:
    metadata:
      labels:
        app: fanout-worker
        app.kubernetes.io/part-of: cascade
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "until pg_isready -h postgres -U cascade -d cascade; do sleep 2; done"]
        - name: wait-redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "until redis-cli -h redis ping | grep -q PONG; do sleep 2; done"]
        - name: wait-kafka
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              for i in $(seq 1 60); do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --topic post-events --describe >/dev/null 2>&1 && exit 0
                sleep 2
              done
              exit 1
      containers:
        - name: fanout-worker
          image: cascade/fanout-worker:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9102
          envFrom:
            - configMapRef:
                name: cascade-config
            - secretRef:
                name: cascade-db
          env:
            - name: REDIS_ADDR
              value: redis:6379
            - name: KAFKA_BROKERS
              value: kafka:29092
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9102
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
