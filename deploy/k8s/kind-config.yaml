kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cascade
nodes:
  - role: control-plane
    extraPortMappings:
      # Gateway NodePort 30080 → host 8080 so `make smoke` needs no extra flags.
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Frontend NodePort 30300 → host 3000.
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
