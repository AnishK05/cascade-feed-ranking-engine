apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: cascade
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    app.kubernetes.io/part-of: cascade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/part-of: cascade
    spec:
      containers:
        - name: gateway
          image: cascade/gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cascade-config
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: POST_SERVICE_ADDR
              value: post-service:9090
            - name: FEED_SERVICE_ADDR
              value: feed-service:9091
            - name: SOCIAL_GRAPH_BASE_URL
              value: http://social-graph-service:8081
            - name: PROMETHEUS_URL
              value: ""
          readinessProbe:
            httpGet:
              path: /api/ping
              port: 8080
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /api/ping
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
