apiVersion: v1
kind: Service
metadata:
  name: post-service
  labels:
    app: post-service
    app.kubernetes.io/part-of: cascade
spec:
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
    - name: metrics
      port: 9100
      targetPort: 9100
  selector:
    app: post-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-service
  labels:
    app: post-service
    app.kubernetes.io/part-of: cascade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-service
  template:
    metadata:
      labels:
        app: post-service
        app.kubernetes.io/part-of: cascade
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "until pg_isready -h postgres -U cascade -d cascade; do sleep 2; done"]
        - name: wait-redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            ["sh", "-c", "until redis-cli -h redis ping | grep -q PONG; do sleep 2; done"]
        - name: wait-kafka
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              for i in $(seq 1 60); do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --topic post-events --describe >/dev/null 2>&1 && exit 0
                sleep 2
              done
              exit 1
      containers:
        - name: post-service
          image: cascade/post-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 9090
            - containerPort: 9100
          envFrom:
            - configMapRef:
                name: cascade-config
            - secretRef:
                name: cascade-db
          env:
            - name: REDIS_ADDR
              value: redis:6379
            - name: KAFKA_BROKERS
              value: kafka:29092
            - name: KAFKA_TOPIC
              value: post-events
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
