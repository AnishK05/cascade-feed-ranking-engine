name: cascade

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cascade
      POSTGRES_USER: cascade
      POSTGRES_PASSWORD: cascade
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Mount only the up migrations: mounting migrations/ wholesale would also execute every
      # *.down.sql file during PostgreSQL's first-boot initialization.
      - ../migrations/000001_create_users_table.up.sql:/docker-entrypoint-initdb.d/001-users.sql:ro
      - ../migrations/000002_create_follows_table.up.sql:/docker-entrypoint-initdb.d/002-follows.sql:ro
      - ../migrations/000003_create_posts_table.up.sql:/docker-entrypoint-initdb.d/003-posts.sql:ro
      - ../migrations/000004_create_engagements_table.up.sql:/docker-entrypoint-initdb.d/004-engagements.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascade -d cascade"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # One-node combined broker/controller KRaft cluster: real Apache Kafka, no ZooKeeper.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      # Containers use kafka:29092; host-native services/tests use localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ../scripts/kafka-init.sh:/opt/cascade/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/opt/cascade/kafka-init.sh"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  post-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      target: post-service
    environment:
      DATABASE_URL: postgres://cascade:cascade@postgres:5432/cascade?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: post-events
      POST_SERVICE_GRPC_PORT: "9090"
      POST_METRICS_ADDR: ":9100"
      POST_BYPASS_CACHE: ${POST_BYPASS_CACHE:-false}
    ports:
      - "9090:9090"
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  feed-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      target: feed-service
    environment:
      DATABASE_URL: postgres://cascade:cascade@postgres:5432/cascade?sslmode=disable
      REDIS_ADDR: redis:6379
      POST_SERVICE_ADDR: post-service:9090
      FEED_SERVICE_GRPC_PORT: "9091"
      FEED_METRICS_ADDR: ":9101"
      FEED_BYPASS_CACHE: ${FEED_BYPASS_CACHE:-false}
    ports:
      - "9091:9091"
      - "9101:9101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      post-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9101/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  fanout-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      target: fanout-worker
    environment:
      DATABASE_URL: postgres://cascade:cascade@postgres:5432/cascade?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:29092
      FANOUT_METRICS_ADDR: ":9102"
      CELEBRITY_FOLLOWER_THRESHOLD: ${CELEBRITY_FOLLOWER_THRESHOLD:-10000}
    ports:
      - "9102:9102"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9102/metrics"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  social-graph-service:
    build:
      context: ../services/social-graph-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://cascade:cascade@postgres:5432/cascade?sslmode=disable
      DB_USER: cascade
      DB_PASSWORD: cascade
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CELEBRITY_THRESHOLD: ${CELEBRITY_THRESHOLD:-10000}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/api/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_PORT: "8080"
      POST_SERVICE_ADDR: post-service:9090
      FEED_SERVICE_ADDR: feed-service:9091
      SOCIAL_GRAPH_BASE_URL: http://social-graph-service:8081
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8080:8080"
    depends_on:
      post-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy
      social-graph-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8080
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  warm-cache:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.go
      target: warm-cache
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://cascade:cascade@postgres:5432/cascade?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  kafka-data:
